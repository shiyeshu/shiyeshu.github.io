  {{/* Valine 评论（沿用旧站 LeanCloud 应用，按文章路径关联历史评论） */}}
  <div id="vcomments" class="valine-container"></div>

  <style>
    .valine-container {
      background-color: var(--card-background);
      border-radius: var(--card-border-radius);
      box-shadow: var(--shadow-l1);
      padding: var(--card-padding);
      --valine-font-size: var(--article-font-size);
    }
    .valine-container .vwrap .vedit .vctrl span,
    .valine-container .vwrap .vheader .vinput,
    .valine-container .vinfo,
    .valine-container .vcard .vhead .vsys,
    .valine-container .vcard .vh .vmeta .vat {
      color: var(--card-text-color-secondary);
    }
    .valine-container .vwrap .vedit .vctrl span.vicon,
    .valine-container .vwrap .vheader .vinput,
    .valine-container .vbtn,
    .valine-container .vcard,
    .valine-container .vwrap .vedit .vcontrol .col a {
      color: var(--card-text-color-main);
    }
    .valine-container .vwrap,
    .valine-container .vwrap .vedit .vcontrol .col a,
    .valine-container .vbtn {
      border-color: var(--card-separator-color);
    }
    .valine-container .vbtn:active,
    .valine-container .vbtn:hover {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }
    .valine-container .vempty {
      color: var(--card-text-color-secondary);
    }
    :root[data-scheme="dark"] .valine-container .vwrap .vedit .vinput,
    :root[data-scheme="dark"] .valine-container .vwrap .vedit .veditor {
      color: var(--card-text-color-main);
    }
  </style>

  {{- with .Site.Params.comments.valine -}}
    <script src="{{ "js/valine.min.js" | relURL }}"></script>
    <script>
      new Valine({
        el: '#vcomments',
        appId: '{{ .appId }}',
        appKey: '{{ .appKey }}',
        serverURLs: '{{ .serverURLs }}',
        path: window.location.pathname,
        visitor: {{ if isset . "visitor" }}{{ .visitor }}{{ else }}true{{ end }},
        recordIP: {{ if isset . "recordIP" }}{{ .recordIP }}{{ else }}false{{ end }},
        enableQQ: {{ if isset . "enableQQ" }}{{ .enableQQ }}{{ else }}true{{ end }},
        pageSize: 10,
        lang: 'zh-cn',
        placeholder: '欢迎交流……'
      });
    </script>
  {{- end -}}
